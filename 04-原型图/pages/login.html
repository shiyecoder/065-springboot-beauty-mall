<!DOCTYPE html><html lang="zh-CN"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>登录 · 美妆护肤商城与试用装派发系统</title><link rel="stylesheet" href="../assets/mock.css"></head><body>
<div class="lg-page">
  <div class="lg-left">
    <div class="lg-brand"><div class="lg-logo">L</div><div><b>LUMA 美妆试销云</b>
      <span>BEAUTY TRIAL &amp; CONVERSION</span></div></div>
    <h1>先试用，<br>再决定要不要爱它。</h1>
    <p class="lg-lead">按肤质匹配派发小样，回收真实试用报告，把每一份派发成本都算到正装转化上。</p>
    <div class="lg-metrics">
      <div><b>12.6 万</b><span>累计派发小样</span></div>
      <div><b>41.8%</b><span>报告提交率</span></div>
      <div><b>23.4%</b><span>正装转化率</span></div>
    </div>
    <div class="lg-quote">"领了不用的人不再占名额，报告也不再只有一句'好用'。"</div>
  </div>
  <div class="lg-right">
    <div class="lg-card">
      <h2>欢迎回来</h2>
      <p class="lg-sub">登录后管理试用派发与转化跟踪</p>
      <div class="lg-tabs"><a class="on" href="login.html">账号登录</a><a href="login.html">短信登录</a></div>
      <div class="lg-field"><label>账号</label><input class="inp" value="operator" placeholder="请输入账号"></div>
      <div class="lg-field"><label>密码</label><input class="inp" type="password" value="123456" placeholder="请输入密码"></div>
      <div class="lg-row"><label class="lg-chk"><input type="checkbox" checked> 记住账号</label>
        <a class="lg-link" href="login.html">忘记密码</a></div>
      <a class="btn pri lg-submit" href="dashboard.html">登 录</a>
      <div class="lg-demo"><b>演示账号</b>
        <span>admin / 123456（管理员）</span><span>operator / 123456（品牌运营）</span>
        <span>user / 123456（试用用户）</span></div>
    </div>
  </div>
