server:
  port: 8080
  servlet:
    encoding:
      charset: UTF-8
      force: true

spring:
  application:
    name: beauty-trial
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://127.0.0.1:3306/new_065?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true&useSSL=false
    username: root
    password: "123456"
    hikari:
      maximum-pool-size: 8
      minimum-idle: 2
  servlet:
    multipart:
      # 商品图与报告图：单文件 5MB（文档要求），单次请求 30MB
      max-file-size: 5MB
      max-request-size: 30MB
  jackson:
    date-format: yyyy-MM-dd HH:mm:ss
    time-zone: Asia/Shanghai

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
  global-config:
    db-config:
      id-type: auto
      logic-delete-field: deleted
      logic-delete-value: 1
      logic-not-delete-value: 0

app:
  upload-dir: ./uploads
  jwt-secret: beauty-trial-graduation-project-2026-secret-key-must-be-long-enough
  jwt-expire-hours: 12

logging:
  level:
    com.grad.beauty: info
